<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أرقام وعناوين</title>
  <meta name="theme-color" content="#8e0b47">
  <meta name="description" content="دليل الزبائن والنقل والفنادق للمناديب">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="أرقام وعناوين">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== شاشة تسجيل الدخول ===== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-banner">
        <h1>📇 أرقام وعناوين</h1>
        <p>سجّل الدخول للمتابعة</p>
      </div>
      <div class="login-fields">
        <select id="login-name" class="input-field">
          <option value="">-- اختر اسمك --</option>
        </select>
        <input type="text" id="login-code" class="input-field" placeholder="الكود" autocomplete="off">
        <button class="btn-primary" id="login-btn" onclick="doLogin()">دخول</button>
        <div class="error-msg" id="login-error"></div>
        <button class="btn-primary" id="install-btn-login" onclick="installApp()" style="display:none; margin-top:10px; background:var(--yellow); color:#5c4200; box-shadow:none;">📲 تثبيت التطبيق على هاتفك</button>
      </div>
    </div>
  </div>

  <!-- ===== واجهة التطبيق ===== -->
  <div id="app-screen">
    <header>
      <div class="top-row">
        <div>
          <h1>📇 أرقام وعناوين</h1>
          <div class="rep-name" id="rep-name-display"></div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="header-btn" id="install-btn" onclick="installApp()">📲 تثبيت</button>
          <button class="header-btn" onclick="toggleDarkMode()" id="dark-toggle">🌙</button>
          <button class="header-btn text" onclick="logout()">خروج ⏻</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="clients" onclick="switchTab('clients')">الزبائن</button>
        <button class="tab-btn" data-tab="transport" onclick="switchTab('transport')">النقل</button>
        <button class="tab-btn" data-tab="hotels" onclick="switchTab('hotels')">الفنادق</button>
      </div>
    </header>

    <div id="status-bar"></div>

    <!-- فلتر المناطق/الولايات (يظهر في الزبائن والفنادق) -->
    <div class="filter-row" id="region-filter" style="display:none;"></div>

    <div class="list-container" id="list-container">
      <div class="empty-state">جارِ تحميل البيانات...</div>
    </div>
  </div>

  <!-- ===== زر ولوحة البحث العائمة ===== -->
  <button id="search-fab" style="display:none;">🔍</button>
  <div id="search-panel" style="display:none;">
    <input type="text" id="search-input" placeholder="ابحث بالاسم..." list="name-suggestions" autocomplete="off">
    <datalist id="name-suggestions"></datalist>
  </div>

  <!-- ===== نافذة التفاصيل ===== -->
  <div id="details-overlay">
    <div id="details-sheet">
      <h2 id="details-title"></h2>
      <div id="details-body"></div>
      <button id="close-details" onclick="closeDetails()">إغلاق</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
